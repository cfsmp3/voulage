name: Harness publish gating (after)
on: push
jobs:
  run:
    uses: ./.github/workflows/zz-harness-build.yml
    with:
      do-publish: "yes"
      force-build: "yes"
      stage: testing
      fail-targets: "testing-ubuntu-stonking-amd64 testing-ubuntu-stonking-arm64"
      fail-late-targets: ""
      expect-legs: "14"
      expect-kept: "debian/bookworm debian/testing debian/trixie ubuntu/jammy ubuntu/noble ubuntu/questing ubuntu/resolute"
      expect-held: "ubuntu/stonking"
    secrets: inherit
