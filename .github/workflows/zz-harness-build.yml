name: Harness Build
run-name: Build ${{ inputs.stage }} ${{ inputs.only-package }} Packages ${{ inputs.distro }} ${{ inputs.codename }} ${{ inputs.arch }}
on:
  workflow_call:
    inputs:
      do-publish:
        description: "Publish after build"
        type: string
        required: true
        default: "yes"
      force-build:
        description: "Force build without check for changes"
        type: string
        required: true
        default: "no"
      stage:
        description: "Stage to build"
        type: string
        required: true
        default: "unstable"
      distro:
        description: "Distro to build (debian, ubuntu)"
        type: string
        required: false
      codename:
        description: "Codename to build (e.g. noble, bookworm)"
        type: string
        required: false
      arch:
        description: "Architecture to build (amd64, arm64)"
        type: string
        required: false
      only-package:
        description: "Only build package"
        type: string
        required: false
      fail-targets:
        type: string
        required: false
        default: ""
      fail-late-targets:
        type: string
        required: false
        default: ""
      expect-legs:
        type: string
        required: false
        default: ""
      expect-kept:
        type: string
        required: false
        default: ""
      expect-held:
        type: string
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.stage }}
  cancel-in-progress: true
# Need to explicitly set shell according to: https://github.com/actions/runner/issues/353#issuecomment-1067227665
defaults:
  run:
    shell: bash
jobs:
  matrix-builder:
    runs-on: ubuntu-24.04
    container: "ghcr.io/regolith-linux/ci-ubuntu:noble-amd64"
    outputs:
      stages: ${{ steps.calc-matrix.outputs.stages }}
      distros: ${{ steps.calc-matrix.outputs.distros }}
      codenames: ${{ steps.calc-matrix.outputs.codenames }}
      arches: ${{ steps.calc-matrix.outputs.arches }}
      suites: ${{ steps.calc-matrix.outputs.suites }}
      runners: ${{ steps.calc-matrix.outputs.runners }}
      includes: ${{ steps.calc-matrix.outputs.includes }}
      excludes: ${{ steps.calc-matrix.outputs.excludes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Calculate Matrix
        id: calc-matrix
        run: |
          if [ -n "${{ inputs.stage }}" ] && [ "${{ inputs.stage }}" != "all" ]; then
            STAGES=(${{ inputs.stage }})
          else
            STAGES=(experimental unstable testing backports)
          fi
          DISTROS=()
          CODENAMES=()
          if [ -n "${{ inputs.arch }}" ]; then
            ARCHES=(${{ inputs.arch }})
          else
            ARCHES=(amd64 arm64)
          fi
          INCLUDES=()
          EXCLUDES=()

          valid_distro_codenames=()

          for stage in "${STAGES[@]}"; do
            if [ ! -d "stage/${stage}" ]; then
              echo "Package model for stage ${stage} not found!"
              continue
            fi

            for dir in $(find stage/${stage}/ -mindepth 2 -maxdepth 2 -type d | sort); do
              for arch in "${ARCHES[@]}"; do
                distro=$(echo $dir | cut -d/ -f3)
                if [ -n "${{ inputs.distro }}" ] && [ "${{ inputs.distro }}" != "$distro" ]; then
                  continue
                fi

                codename=$(echo $dir | cut -d/ -f4)
                if [ -n "${{ inputs.codename }}" ] && [ "${{ inputs.codename }}" != "$codename" ]; then
                  continue
                fi

                if [[ ! " ${DISTROS[*]} " =~ [[:space:]]${distro}[[:space:]] ]]; then
                  DISTROS+=("${distro}")
                fi
                if [[ ! " ${CODENAMES[*]} " =~ [[:space:]]${codename}[[:space:]] ]]; then
                  CODENAMES+=("${codename}")
                fi
                if [[ ! " ${valid_distro_codenames[*]} " =~ [[:space:]]${distro}-${codename}[[:space:]] ]]; then
                  valid_distro_codenames+=("${distro}-${codename}")
                fi
              done
            done
          done

          for distro in "${DISTROS[@]}"; do
            for codename in "${CODENAMES[@]}"; do
              if [[ ! " ${valid_distro_codenames[*]} " =~ [[:space:]]${distro}-${codename}[[:space:]] ]]; then
                EXCLUDES+=($(jq -n -c --arg distro "$distro" --arg codename "$codename" '$ARGS.named'))
              fi
            done
          done

          if [[ "${{ inputs.stage }}" == "release-"* ]]; then
            EXCLUDES+=($(jq -n -c --arg distro "debian" --arg codename "testing" '$ARGS.named'))
          fi

          SUITES=$(jq -n "$(jq -n -c \
            --argjson experimental "$(jq -n -c --arg suite "experimental" --arg component "main" '$ARGS.named')" \
            --argjson unstable "$(jq -n -c --arg suite "unstable" --arg component "main" '$ARGS.named')" \
            --argjson testing "$(jq -n -c --arg suite "testing" --arg component "main" '$ARGS.named')" \
            --argjson backports "$(jq -n -c --arg suite "backports" --arg component "main" '$ARGS.named')" \
            --argjson stable "$(jq -n -c --arg suite "stable" --arg component "main" '$ARGS.named')" \
            --argjson release-3_0 "$(jq -n -c --arg suite "stable" --arg component "3.0" '$ARGS.named')" \
            --argjson release-3_1 "$(jq -n -c --arg suite "stable" --arg component "3.1" '$ARGS.named')" \
            --argjson release-3_2 "$(jq -n -c --arg suite "stable" --arg component "3.2" '$ARGS.named')" \
            --argjson release-3_3 "$(jq -n -c --arg suite "stable" --arg component "3.3" '$ARGS.named')" \
            --argjson release-3_4 "$(jq -n -c --arg suite "stable" --arg component "3.4" '$ARGS.named')" \
            --argjson release-3_5 "$(jq -n -c --arg suite "stable" --arg component "3.5" '$ARGS.named')" \
            '$ARGS.named'\
          )" '$ARGS.named')

          echo "stages=$(jq -n -c '$ARGS.positional' --args -- "${STAGES[@]}")" >> $GITHUB_OUTPUT
          echo "distros=$(jq -n -c '$ARGS.positional' --args -- "${DISTROS[@]}")" >> $GITHUB_OUTPUT
          echo "codenames=$(jq -n -c '$ARGS.positional' --args -- "${CODENAMES[@]}")" >> $GITHUB_OUTPUT
          echo "arches=$(jq -n -c '$ARGS.positional' --args -- "${ARCHES[@]}")" >> $GITHUB_OUTPUT
          echo "suites=$(jq -n -c "${SUITES}" '$ARGS.named')" >> $GITHUB_OUTPUT
          echo "runners=$(jq -n -c "$(jq -n -c --arg amd64 "ubuntu-24.04" --arg arm64 "ubuntu-24.04-arm" '$ARGS.named')" '$ARGS.named')" >> $GITHUB_OUTPUT
          echo "includes=$(jq -n -c "[$(printf '%s\n' "${INCLUDES[@]}" | paste -sd,)]" '$ARGS.named')" >> $GITHUB_OUTPUT
          echo "excludes=$(jq -n -c "[$(printf '%s\n' "${EXCLUDES[@]}" | paste -sd,)]" '$ARGS.named')" >> $GITHUB_OUTPUT
  # build packages and sources
  build:
    runs-on: ${{ fromJSON(needs.matrix-builder.outputs.runners)[matrix.arch] }}
    needs: matrix-builder
    container: "ghcr.io/regolith-linux/ci-${{ matrix.distro }}:${{ matrix.codename }}-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.matrix-builder.outputs.stages) }}
        distro: ${{ fromJSON(needs.matrix-builder.outputs.distros) }}
        codename: ${{ fromJSON(needs.matrix-builder.outputs.codenames) }}
        arch: ${{ fromJSON(needs.matrix-builder.outputs.arches) }}
        include: ${{ fromJSON(needs.matrix-builder.outputs.includes) }}
        exclude: ${{ fromJSON(needs.matrix-builder.outputs.excludes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Job Parameters
        id: init
        run: |
          export GH_WORKSPACE="/__w/voulage/voulage"

          echo "gh-repo-path=${GH_WORKSPACE}" >> $GITHUB_OUTPUT
          echo "changelogs-path=${GH_WORKSPACE}/changelogs" >> $GITHUB_OUTPUT
          echo "manifest-path=${GH_WORKSPACE}/manifests" >> $GITHUB_OUTPUT
          echo "package-build-path=${GH_WORKSPACE}/packages" >> $GITHUB_OUTPUT
          echo "package-publish-path=${GH_WORKSPACE}/publish" >> $GITHUB_OUTPUT
          echo "stage=${{ matrix.stage }}" >> $GITHUB_OUTPUT
          echo "distro=${{ matrix.distro }}" >> $GITHUB_OUTPUT
          echo "codename=${{ matrix.codename }}" >> $GITHUB_OUTPUT
          echo "arch=${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "suite=${{ fromJSON(needs.matrix-builder.outputs.suites)[matrix.stage]['suite'] }}" >> $GITHUB_OUTPUT
          echo "component=${{ fromJSON(needs.matrix-builder.outputs.suites)[matrix.stage]['component'] }}" >> $GITHUB_OUTPUT
          echo "target=${{ matrix.stage }}-${{ matrix.distro }}-${{ matrix.codename }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
      - name: Fake Build
        id: changes
        env:
          FAIL: ${{ inputs.fail-targets }}
        run: |
          set -e
          t="${{ steps.init.outputs.target }}"
          distro="${{ steps.init.outputs.distro }}"; codename="${{ steps.init.outputs.codename }}"
          suite="${{ steps.init.outputs.suite }}"; component="${{ steps.init.outputs.component }}"; arch="${{ steps.init.outputs.arch }}"
          echo "changed=1" >> $GITHUB_OUTPUT
          if [[ " $FAIL " == *" $t "* ]]; then echo "HARNESS: simulated build failure of $t (before upload)"; exit 1; fi
          m="${{ steps.init.outputs.manifest-path }}"; c="${{ steps.init.outputs.changelogs-path }}"
          mkdir -p "$m" "$c"
          echo "harness manifest from $t, run ${{ github.run_id }}" > "$m/${distro}_${codename}_${suite}-${component}_manifest.txt"
          echo "Published fake_1.0_${arch}.deb in $distro/$codename/${{ steps.init.outputs.stage }}" > "$c/CHANGELOG_$t.txt"
          echo "${distro}=${codename}=${suite}=f=fake=1.0-1=fake_1.0.orig.tar.gz" > "$c/SOURCELOG_$t.txt"
          s="${{ steps.init.outputs.gh-repo-path }}/server"
          p="$s/packages/voulage/run-${{ github.run_id }}/$distro/$codename/$suite"
          w="$s/workspace/voulage/run-${{ github.run_id }}"
          mkdir -p "$p" "$w"
          echo "deb $t" > "$p/fake_1.0_$arch.deb"
          cp "$c/SOURCELOG_$t.txt" "$w/"
      - name: Fake Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: SERVER_${{ steps.init.outputs.target }}
          path: ${{ steps.init.outputs.gh-repo-path }}/server/
      - name: Fake Late Failure
        env:
          FAIL_LATE: ${{ inputs.fail-late-targets }}
        run: |
          t="${{ steps.init.outputs.target }}"
          if [[ " $FAIL_LATE " == *" $t "* ]]; then echo "HARNESS: simulated failure of $t after its upload"; exit 1; fi
      - name: Upload Manifests
        uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 1
        with:
          name: MANIFESTS_${{ steps.init.outputs.target }}
          path: "${{ steps.init.outputs.manifest-path }}/*_manifest.txt"
      - name: Upload Changelogs
        uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 1
        with:
          name: CHANGELOG_${{ steps.init.outputs.target }}
          path: ${{ steps.init.outputs.changelogs-path }}/*${{ steps.init.outputs.target }}.txt
      # Last step: the changelogs job publishes only the targets whose legs all
      # reached it (see failed-targets.sh).
      - name: Mark Target Built
        run: |
          mkdir -p ${{ steps.init.outputs.gh-repo-path }}/built
          echo "${{ steps.init.outputs.target }}" > ${{ steps.init.outputs.gh-repo-path }}/built/${{ steps.init.outputs.target }}
      - name: Upload Build Marker
        uses: actions/upload-artifact@v4
        with:
          name: BUILT_${{ steps.init.outputs.target }}
          path: ${{ steps.init.outputs.gh-repo-path }}/built/${{ steps.init.outputs.target }}
  # calculate changelogs, and hold back the targets with a failed build leg
  # so that the other targets still publish
  changelogs:
    runs-on: ubuntu-24.04
    container: "ghcr.io/regolith-linux/ci-ubuntu:noble-amd64"
    needs: [matrix-builder, build]
    if: ${{ !cancelled() && inputs.do-publish == 'yes' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    outputs:
      package-changed: ${{ steps.check.outputs.package-changed }}
      source-changed: ${{ steps.check.outputs.source-changed }}
      held-manifests: ${{ steps.hold.outputs.held-manifests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: changelogs
          pattern: CHANGELOG_*
          merge-multiple: true
      - name: Fake Server
        uses: actions/download-artifact@v4
        with:
          path: /opt/archives
          pattern: SERVER_*
          merge-multiple: true
      - name: Download Build Markers
        uses: actions/download-artifact@v4
        with:
          path: built
          pattern: BUILT_*
          merge-multiple: true
      - name: Find Failed Targets
        id: hold
        env:
          STAGES: ${{ needs.matrix-builder.outputs.stages }}
          DISTROS: ${{ needs.matrix-builder.outputs.distros }}
          CODENAMES: ${{ needs.matrix-builder.outputs.codenames }}
          ARCHES: ${{ needs.matrix-builder.outputs.arches }}
          EXCLUDES: ${{ needs.matrix-builder.outputs.excludes }}
          INCLUDES: ${{ needs.matrix-builder.outputs.includes }}
          SUITES: ${{ needs.matrix-builder.outputs.suites }}
          RUN_FOLDER: run-${{ github.run_id }}
        run: |
          set -e
          set -o pipefail

          mkdir -p built
          .github/scripts/failed-targets.sh built > failed-targets.txt

          held_manifests=()
          packages_paths=()
          sourcelogs=()
          mapfile -t arches < <(jq -r '.[]' <<<"$ARCHES")

          while read -r stage distro codename; do
            suite=$(jq -r --arg stage "$stage" '.[$stage].suite' <<<"$SUITES")
            component=$(jq -r --arg stage "$stage" '.[$stage].component' <<<"$SUITES")
            echo "::warning::Not publishing $stage $distro $codename: one of its build legs failed."

            held_manifests+=("${distro}_${codename}_${suite}-${component}_manifest.txt")
            packages_paths+=("$distro/$codename/$suite")
            if [ "$suite" == "stable" ]; then
              packages_paths+=("$distro/$codename/$component")
            fi
            for arch in "${arches[@]}"; do
              target="$stage-$distro-$codename-$arch"
              rm -f "changelogs/CHANGELOG_$target.txt" "changelogs/SOURCELOG_$target.txt"
              sourcelogs+=("SOURCELOG_$target.txt")
            done
          done < failed-targets.txt

          echo "held-manifests=${held_manifests[*]}" >> $GITHUB_OUTPUT

          # The legs that passed have already uploaded their packages and
          # sourcelogs: the next step moves the held targets' files out of
          # this run's folders, so that the source and publish jobs don't see
          # them. Pairs of "<from> <to>" paths on the server.
          hold=()
          for path in "${packages_paths[@]}"; do
            hold+=("/opt/archives/packages/voulage/$RUN_FOLDER/$path" "/opt/archives/packages/voulage/held/$RUN_FOLDER/$path")
          done
          for file in "${sourcelogs[@]}"; do
            hold+=("/opt/archives/workspace/voulage/$RUN_FOLDER/$file" "/opt/archives/workspace/voulage/held/$RUN_FOLDER/$file")
          done
          echo "hold=${hold[*]}" >> $GITHUB_OUTPUT
      - name: Setup SSH
        if: steps.hold.outputs.hold != ''
        run: |
          printf '#!/bin/sh\necho "HARNESS ssh $*" >&2\nshift\nexec sh -c "$1"\n' > /usr/local/bin/ssh
          chmod +x /usr/local/bin/ssh
      - name: Hold Failed Targets
        if: steps.hold.outputs.hold != ''
        env:
          server-address: "${{ secrets.KAMATERA_HOSTNAME2 }}"
          server-username: "${{ secrets.KAMATERA_USERNAME }}"
          HOLD: ${{ steps.hold.outputs.hold }}
        run: |
          ssh ${{ env.server-username }}@${{ env.server-address }} "sh -s -- $HOLD" <<'EOF'
          set -e
          while [ $# -gt 0 ]; do
            if [ -e "$1" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
              echo "Held $1 in $2"
            fi
            shift 2
          done
          EOF
      - name: Check Changelogs
        id: check
        run: |
          set -e

          if [ ! -d changelogs ]; then
            echo "No package file found to publish!"
            echo "No source file found to rebuild!"

            echo "package-changed=0" >> $GITHUB_OUTPUT
            echo "source-changed=0" >> $GITHUB_OUTPUT
          else
            ls -R changelogs/

            echo "package-changed=$(find changelogs -name CHANGELOG_\*.txt | wc -l)" >> $GITHUB_OUTPUT
            echo "source-changed=$(find changelogs -name SOURCELOG_\*.txt | wc -l)" >> $GITHUB_OUTPUT
          fi
      - name: Harness Check Changelogs And Server
        env:
          EXPECT_LEGS: ${{ inputs.expect-legs }}
          EXPECT_KEPT: ${{ inputs.expect-kept }}
          EXPECT_HELD: ${{ inputs.expect-held }}
          GOT_LEGS: ${{ steps.check.outputs.package-changed }}
          GOT_SOURCES: ${{ steps.check.outputs.source-changed }}
          HELD_MANIFESTS: ${{ steps.hold.outputs.held-manifests }}
          RUN: run-${{ github.run_id }}
        run: |
          bad=0
          echo "package-changed=$GOT_LEGS source-changed=$GOT_SOURCES held-manifests=[$HELD_MANIFESTS]"
          find /opt/archives -type f | sort
          [ "$GOT_LEGS" == "$EXPECT_LEGS" ] || { echo "HARNESS FAIL: package-changed $GOT_LEGS != $EXPECT_LEGS"; bad=1; }
          [ "$GOT_SOURCES" == "$EXPECT_LEGS" ] || { echo "HARNESS FAIL: source-changed $GOT_SOURCES != $EXPECT_LEGS"; bad=1; }
          for dc in $EXPECT_KEPT; do
            [ -d "/opt/archives/packages/voulage/$RUN/$dc/testing" ] || { echo "HARNESS FAIL: $dc not in run folder"; bad=1; }
            [ ! -e "/opt/archives/packages/voulage/held/$RUN/$dc" ] || { echo "HARNESS FAIL: $dc held"; bad=1; }
          done
          for dc in $EXPECT_HELD; do
            [ ! -e "/opt/archives/packages/voulage/$RUN/$dc/testing" ] || { echo "HARNESS FAIL: $dc still in run folder"; bad=1; }
            ls /opt/archives/workspace/voulage/$RUN/SOURCELOG_testing-${dc%/*}-${dc#*/}-* 2>/dev/null && { echo "HARNESS FAIL: $dc sourcelog still in run folder"; bad=1; }
            [[ " $HELD_MANIFESTS " == *" ${dc%/*}_${dc#*/}_testing-main_manifest.txt "* ]] || { echo "HARNESS FAIL: $dc manifest not held"; bad=1; }
          done
          [ $bad == 0 ] && echo "HARNESS OK: changelogs and server state as expected"
          exit $bad
  # rebuild sources
  source:
    needs: [changelogs]
    if: ${{ !cancelled() && inputs.do-publish == 'yes' && needs.changelogs.result == 'success' && needs.changelogs.outputs.source-changed != 0 }}
    uses: ./.github/workflows/zz-harness-stub.yml
    with:
      pull-from: /opt/archives/workspace/
      push-to: /opt/archives/packages/
      only-codename: ${{ inputs.codename }}
    secrets: inherit
  # publish archives
  publish:
    needs: [changelogs, source]
    if: ${{ !cancelled() && inputs.do-publish == 'yes' && needs.changelogs.result == 'success' && needs.source.result != 'failure' && needs.changelogs.outputs.package-changed != 0 }}
    uses: ./.github/workflows/zz-harness-stub.yml
    with:
      packages-path: /opt/archives/packages/
      only-codename: ${{ inputs.codename }}
    secrets: inherit
  # update manifests
  manifests:
    runs-on: ubuntu-24.04
    container: "ghcr.io/regolith-linux/ci-ubuntu:noble-amd64"
    needs: [changelogs, source, publish]
    if: ${{ !cancelled() && inputs.do-publish == 'yes' && needs.changelogs.result == 'success' && needs.source.result != 'failure' && needs.publish.result != 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: manifests
          pattern: MANIFESTS_*
          merge-multiple: true
      - name: Check Manifests
        env:
          HELD_MANIFESTS: ${{ needs.changelogs.outputs.held-manifests }}
        run: |
          # held targets keep their old manifest, so the next run builds them again
          for file in $HELD_MANIFESTS; do
            rm -fv "manifests/$file"
          done

          for file in manifests/*_manifest.txt; do
            if [ ! -f "$file" ]; then
              continue
            fi

            filename="$(basename $file)"
            distro="$(echo $filename | cut -d"_" -f1)"
            codename="$(echo $filename | cut -d"_" -f2)"
            suite="$(echo $filename | cut -d"_" -f3)"
            name="$(echo $filename | cut -d"_" -f4)"

            mkdir -p manifests/$distro/$codename/$suite/
            mv $file manifests/$distro/$codename/$suite/$name
          done
      - name: Harness Check Manifests
        env:
          EXPECT_KEPT: ${{ inputs.expect-kept }}
          EXPECT_HELD: ${{ inputs.expect-held }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain -uall manifests/
          bad=0
          for dc in $EXPECT_KEPT; do
            [ -n "$(git status --porcelain -uall manifests/$dc/testing-main)" ] || { echo "HARNESS FAIL: $dc manifest not updated"; bad=1; }
          done
          for dc in $EXPECT_HELD; do
            [ -z "$(git status --porcelain -uall manifests/$dc/testing-main)" ] || { echo "HARNESS FAIL: $dc manifest updated"; bad=1; }
          done
          [ $bad == 0 ] && echo "HARNESS OK: manifests as expected"
          exit $bad
